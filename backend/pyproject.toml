[project]
name = "easyops-workbench"
version = "0.1.0"
description = "EasyOps 多用户只读运维分析与配置工作台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.29",
  "copilotkit==0.1.96",
  "ag-ui-langgraph==0.0.47",
  "fastapi==0.157.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "mcp==1.30.0",
  "langchain-openai==1.7.2",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary,pool]==3.3.6",
  "cryptography==50.0.2",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["easyops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
